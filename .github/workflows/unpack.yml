name: unpack
on: workflow_dispatch
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          unzip -q rooms.zip
          cp -r rooms/. .
          rm -rf rooms rooms.zip
          git config user.name github-actions
          git config user.email actions@github.com
          git add -A
          git commit -m "unpack rooms"
          git push
